<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3545"/>
      <stop offset=".52" stop-color="#557888"/>
      <stop offset="1" stop-color="#a6bbc3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111d25" stop-opacity=".94"/>
      <stop offset="1" stop-color="#101820" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00e5ff"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".3"/></filter>
    <style>
      .label{font-family:Segoe UI,Arial,sans-serif;fill:#edf6fa}
      .muted{fill:#91a5b5}
      .tiny{font-size:11px;font-weight:700;letter-spacing:1.5px}
      .value{font-size:25px;font-weight:700}
      .call{fill:#0d161d;stroke:#3f5664;stroke-width:1.5}
      .calltext{font-size:14px;font-weight:650}
      .wire{fill:none;stroke:#bcd2dc;stroke-width:1.5;stroke-dasharray:4 4}
      .num{fill:#081318;stroke:#00e5ff;stroke-width:2}
      .numtext{font-size:15px;font-weight:800;fill:#00e5ff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="820" fill="url(#sky)"/>
  <circle cx="190" cy="110" r="180" fill="#dcebf0" opacity=".12"/>
  <path d="M0 625 Q250 520 475 610T920 595T1300 575T1600 620V820H0Z" fill="#122731" opacity=".42"/>
  <text x="800" y="62" text-anchor="middle" class="label" font-size="30" font-weight="700">FLIGHT SIM OVERLAY · ANATOMY</text>
  <text x="800" y="88" text-anchor="middle" class="label muted" font-size="13" letter-spacing="2">VERSION 2.0.0 · LIVE GATE-TO-GATE INSTRUMENT STRIP</text>

  <g filter="url(#shadow)">
    <rect x="120" y="250" width="1360" height="285" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".19"/>
  </g>
  <line x1="140" y1="301" x2="1460" y2="301" stroke="#fff" stroke-opacity=".13"/>
  <text x="146" y="275" class="label muted tiny">N825G</text>
  <text x="210" y="275" class="label" font-size="15" font-weight="700">KGCN  →  KLAS</text>
  <g class="label muted" font-size="11" font-weight="650">
    <circle cx="665" cy="273" r="4" fill="#54e39e"/><text x="675" y="277">SIMCONNECT</text>
    <circle cx="770" cy="273" r="4" fill="#54e39e"/><text x="780" y="277">SIMBRIEF</text>
    <circle cx="862" cy="273" r="4" fill="#54e39e"/><text x="872" y="277">SAYINTENTIONS</text>
    <circle cx="997" cy="273" r="4" fill="#00e5ff"/><text x="1007" y="277">VATSIM</text>
  </g>
  <rect x="1334" y="261" width="116" height="25" rx="13" fill="#00e5ff" fill-opacity=".1" stroke="#00e5ff" stroke-opacity=".45"/>
  <text x="1392" y="278" text-anchor="middle" class="label" fill="#00e5ff" font-size="11" font-weight="750">CLIMB</text>

  <g class="label" text-anchor="middle">
    <g transform="translate(155 327)"><text x="63" class="muted tiny">AIRSPEED</text><text x="63" y="35" class="value">286 <tspan class="muted" font-size="12">kt</tspan></text></g>
    <g transform="translate(275 327)"><text x="63" class="muted tiny">GROUNDSPEED</text><text x="63" y="35" class="value">301 <tspan class="muted" font-size="12">kt</tspan></text></g>
    <g transform="translate(395 327)"><text x="63" class="muted tiny">ALTITUDE</text><text x="63" y="35" class="value">18,420 <tspan class="muted" font-size="12">ft</tspan></text></g>
    <g transform="translate(515 327)"><text x="63" class="muted tiny">VERTICAL SPEED</text><text x="63" y="35" class="value">+1,650 <tspan class="muted" font-size="12">fpm</tspan></text></g>
  </g>
  <line x1="660" y1="319" x2="660" y2="380" stroke="#fff" stroke-opacity=".12"/>
  <line x1="940" y1="319" x2="940" y2="380" stroke="#fff" stroke-opacity=".12"/>
  <text x="800" y="327" text-anchor="middle" class="label muted tiny">MAGNETIC HEADING</text>
  <text x="800" y="369" text-anchor="middle" class="label" font-size="43" font-weight="750">087<tspan fill="#ff8a3d" font-size="15">°</tspan></text>
  <line x1="683" y1="386" x2="917" y2="386" stroke="#fff" stroke-opacity=".2"/>
  <g class="label muted" font-size="9" text-anchor="middle">
    <text x="700" y="381">060</text><text x="750" y="381">075</text><text x="850" y="381">105</text><text x="900" y="381">120</text>
  </g>
  <path d="M800 376l-7 10h14Z" fill="#ff8a3d"/>
  <g class="label" text-anchor="middle">
    <g transform="translate(950 327)"><text x="50" class="muted tiny">NEXT WAYPOINT</text><text x="50" y="35" class="value">74.2 <tspan class="muted" font-size="12">nm</tspan></text></g>
    <g transform="translate(1050 327)"><text x="50" class="muted tiny">TIME ENROUTE</text><text x="50" y="35" class="value">1<tspan class="muted" font-size="12">h</tspan> 08<tspan class="muted" font-size="12">m</tspan></text></g>
    <g transform="translate(1150 327)"><text x="50" class="muted tiny">ETA</text><text x="50" y="35" class="value">21:46Z</text></g>
    <g transform="translate(1250 327)"><text x="50" class="muted tiny">LATITUDE</text><text x="50" y="35" class="value" font-size="19">36.2481°N</text></g>
    <g transform="translate(1350 327)"><text x="50" class="muted tiny">LONGITUDE</text><text x="50" y="35" class="value" font-size="19">114.6842°W</text></g>
  </g>
  <line x1="140" y1="408" x2="1460" y2="408" stroke="#fff" stroke-opacity=".13"/>
  <text x="146" y="431" class="label" font-size="14" font-weight="750">KGCN</text><text x="198" y="431" class="label muted" font-size="10">Grand Canyon</text>
  <text x="800" y="431" text-anchor="middle" class="label muted" font-size="10"><tspan fill="#00e5ff" font-weight="750">42%</tspan> ROUTE COMPLETE</text>
  <text x="1454" y="431" text-anchor="end" class="label" font-size="14" font-weight="750">KLAS</text>
  <line x1="148" y1="460" x2="1452" y2="460" stroke="#fff" stroke-opacity=".2" stroke-width="3"/>
  <line x1="148" y1="460" x2="697" y2="460" stroke="url(#route)" stroke-width="4"/>
  <circle cx="148" cy="460" r="6" fill="#00e5ff"/><circle cx="1452" cy="460" r="6" fill="#ff8a3d"/>
  <g transform="translate(697 460)" fill="#fff">
    <g transform="rotate(90) scale(.42) translate(-32 -32)"><path d="M32 3c3 0 4 4 4 8v13l22 14v6L36 37v13l8 6v4l-12-3-12 3v-4l8-6V37L6 44v-6l22-14V11c0-4 1-8 4-8Z"/></g>
  </g>
  <g class="label muted" font-size="9" font-weight="700" text-anchor="middle">
    <text x="190" y="491" fill="#00e5ff">GATE</text><text x="315" y="491" fill="#00e5ff">TAXI</text><text x="440" y="491" fill="#00e5ff">DEPART</text><text x="565" y="491" fill="#fff">CLIMB</text>
    <text x="690" y="491">CRUISE</text><text x="815" y="491">DESCEND</text><text x="940" y="491">APPROACH</text><text x="1065" y="491">LAND</text><text x="1190" y="491">TAXI</text><text x="1315" y="491">GATE</text>
  </g>

  <!-- Callouts -->
  <g class="label">
    <path class="wire" d="M250 203V235H320V259"/><circle class="num" cx="250" cy="182" r="18"/><text class="numtext" x="250" y="188">1</text><rect class="call" x="118" y="118" width="264" height="42" rx="9"/><text class="calltext" x="250" y="144" text-anchor="middle">Flight identity</text>
    <path class="wire" d="M775 203V243"/><circle class="num" cx="775" cy="182" r="18"/><text class="numtext" x="775" y="188">2</text><rect class="call" x="643" y="118" width="264" height="42" rx="9"/><text class="calltext" x="775" y="144" text-anchor="middle">Connection rail</text>
    <path class="wire" d="M1370 203V242H1392V260"/><circle class="num" cx="1370" cy="182" r="18"/><text class="numtext" x="1370" y="188">3</text><rect class="call" x="1238" y="118" width="264" height="42" rx="9"/><text class="calltext" x="1370" y="144" text-anchor="middle">Confirmed flight phase</text>
    <path class="wire" d="M220 579V548H380V385"/><circle class="num" cx="220" cy="600" r="18"/><text class="numtext" x="220" y="606">4</text><rect class="call" x="88" y="623" width="264" height="42" rx="9"/><text class="calltext" x="220" y="649" text-anchor="middle">Primary telemetry</text>
    <path class="wire" d="M540 579V550H800V396"/><circle class="num" cx="540" cy="600" r="18"/><text class="numtext" x="540" y="606">5</text><rect class="call" x="408" y="623" width="264" height="42" rx="9"/><text class="calltext" x="540" y="649" text-anchor="middle">Magnetic heading</text>
    <path class="wire" d="M1380 579V548H1220V385"/><circle class="num" cx="1380" cy="600" r="18"/><text class="numtext" x="1380" y="606">6</text><rect class="call" x="1248" y="623" width="264" height="42" rx="9"/><text class="calltext" x="1380" y="649" text-anchor="middle">Route &amp; position data</text>
    <path class="wire" d="M780 579V540H640V463"/><circle class="num" cx="780" cy="600" r="18"/><text class="numtext" x="780" y="606">7</text><rect class="call" x="688" y="683" width="184" height="42" rx="9"/><text class="calltext" x="780" y="709" text-anchor="middle">Route progress</text>
    <path class="wire" d="M1000 579V530H697V470"/><circle class="num" cx="1000" cy="600" r="18"/><text class="numtext" x="1000" y="606">8</text><rect class="call" x="908" y="683" width="184" height="42" rx="9"/><text class="calltext" x="1000" y="709" text-anchor="middle">Aircraft marker</text>
    <path class="wire" d="M1160 579V520H1000V495"/><circle class="num" cx="1160" cy="600" r="18"/><text class="numtext" x="1160" y="606">9</text><rect class="call" x="1068" y="743" width="184" height="42" rx="9"/><text class="calltext" x="1160" y="769" text-anchor="middle">Phase timeline</text>
  </g>
</svg>
